name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sanity-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile app.py (catches syntax errors)
        run: python -m py_compile app.py

      - name: Verify app.py matches devcontainer's launch command
        run: |
          grep -q '"app.py"' .devcontainer/devcontainer.json && \
          echo "OK: devcontainer references app.py" || \
          (echo "devcontainer.json does not reference app.py - Codespaces launch will fail" && exit 1)
